name: telegram-login
on:
  repository_dispatch:
    types: [login-request]
# Allow multiple logins in parallel, one job per login_id
concurrency:
  group: login-${{ github.event.client_payload.login_id }}
  cancel-in-progress: false
jobs:
  login:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: 'pip', cache-dependency-path: bot/requirements.txt }
      - run: pip install -r bot/requirements.txt
      - name: Run Telegram login flow
        env:
          CF_API_URL: ${{ secrets.CF_API_URL }}
          BOT_API_KEY: ${{ secrets.BOT_API_KEY }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          SESSION_ENCRYPTION_KEY: ${{ secrets.SESSION_ENCRYPTION_KEY }}
          LOGIN_ID: ${{ github.event.client_payload.login_id }}
          PHONE: ${{ github.event.client_payload.phone }}
        run: cd bot && python src/login_flow.py
