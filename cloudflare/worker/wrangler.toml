name = "selfbot-api"
main = "src/index.js"
compatibility_date = "2024-06-01"

# D1 database binding
[[d1_databases]]
binding = "DB"
database_name = "selfbot-db"
database_id = "2b82d6f6-ef07-4a5a-a7d6-62dcbf741383"

[vars]
PAGES_URL = "https://your-dashboard.pages.dev"
# How often the cron checks/dispatches (also used as fallback)
DISPATCH_CHECK_MINUTES = "5"

# Cron: runs every 5 minutes to check if a new job should start
[triggers]
crons = ["*/5 * * * *"]