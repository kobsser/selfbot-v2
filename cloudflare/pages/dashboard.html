<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="dashboard.title">Dashboard</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-brand">🐱 Selfbot</div>
    <div class="nav-actions">
      <button id="langToggle" class="icon-btn">EN/FA</button>
      <button id="themeToggle" class="icon-btn">🌓</button>
      <button id="logoutBtn" class="btn btn-sm btn-outline" data-i18n="dashboard.logout">Logout</button>
    </div>
  </nav>

  <main class="container">
    <div class="page-header">
      <h1 data-i18n="dashboard.title">Dashboard</h1>
      <div class="header-actions">
        <span id="accountCount" class="badge"></span>
        <button id="addAccountBtn" class="btn btn-primary" data-i18n="dashboard.add_account">Add Account</button>
      </div>
    </div>

    <div id="accountsList" class="accounts-grid"></div>

    <!-- Add Account Modal -->
    <div id="addModal" class="modal hidden">
      <div class="modal-content">
        <h3 data-i18n="dashboard.add_account">Add Account</h3>
        <div class="form-group">
          <label data-i18n="dashboard.phone">Phone Number</label>
          <input type="text" id="newPhone" placeholder="+1234567890">
        </div>
        <div class="form-group">
          <label data-i18n="dashboard.display_name">Display Name</label>
          <input type="text" id="newName" placeholder="My Account">
        </div>
        <div class="form-group">
          <label data-i18n="dashboard.session_string">Session String</label>
          <textarea id="newSession" rows="4" placeholder="Paste Pyrogram session string"></textarea>
          <small class="hint" data-i18n="dashboard.session_hint">The session string will be encrypted before storage.</small>
        </div>
        <div class="modal-actions">
          <button class="btn btn-outline" id="cancelAdd" data-i18n="common.cancel">Cancel</button>
          <button class="btn btn-primary" id="confirmAdd" data-i18n="common.save">Save</button>
        </div>
      </div>
    </div>

    <!-- Settings Modal -->
    <div id="settingsModal" class="modal hidden">
      <div class="modal-content modal-wide">
        <h3><span data-i18n="dashboard.settings">Settings</span>: <span id="settingsAccountName"></span></h3>

        <div class="settings-section">
          <h4 data-i18n="dashboard.features">Features</h4>
          <label class="toggle-row">
            <span>😺 <span data-i18n="game.meow">Meow</span></span>
            <input type="checkbox" id="setMeow">
          </label>
          <label class="toggle-row">
            <span>🐱 <span data-i18n="game.pishi">Pishi</span></span>
            <input type="checkbox" id="setFish">
          </label>
          <label class="toggle-row">
            <span>📦 <span data-i18n="game.smuggle">Smuggle</span></span>
            <input type="checkbox" id="setSmuggle">
          </label>
        </div>

        <div class="settings-section">
          <h4 data-i18n="dashboard.groups">Selected Groups</h4>
          <div class="form-group">
            <label>Group IDs (comma-separated)</label>
            <input type="text" id="setGroups" placeholder="-1001234567890, -1009876543210">
          </div>
        </div>

        <div class="settings-section">
          <h4 data-i18n="dashboard.timing">Timing</h4>
          <div class="form-group">
            <label data-i18n="dashboard.meow_interval">Meow Interval (seconds)</label>
            <input type="number" id="setInterval" min="60" value="300">
          </div>
        </div>

        <div class="modal-actions">
          <button class="btn btn-danger" id="deleteAccount" data-i18n="dashboard.delete_account">Delete Account</button>
          <div class="spacer"></div>
          <button class="btn btn-outline" id="cancelSettings" data-i18n="common.cancel">Cancel</button>
          <button class="btn btn-primary" id="saveSettings" data-i18n="common.save">Save</button>
        </div>
      </div>
    </div>
  </main>

  <script>
    window.API_BASE = 'https://selfbot-api.kobsser-m.workers.dev';
  </script>
  <script src="/js/theme.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
  <script>
    initDashboard();
  </script>
</body>
</html>
