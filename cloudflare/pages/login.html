<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="login.title">Login</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="theme-toggle-row">
        <button id="themeToggle" class="icon-btn" title="Toggle theme">🌓</button>
        <button id="langToggle" class="icon-btn" title="Toggle language">EN/FA</button>
      </div>
      <h2 data-i18n="login.title">Login</h2>
      <div id="mode-indicator" class="mode-badge"></div>
      <form id="authForm">
        <div class="form-group" id="passwordGroup">
          <label data-i18n="login.password">Password</label>
          <input type="password" id="password" required autocomplete="current-password">
        </div>
        <div class="form-group hidden" id="confirmGroup">
          <label data-i18n="login.confirm_password">Confirm Password</label>
          <input type="password" id="confirmPassword" autocomplete="new-password">
        </div>
        <button type="submit" class="btn btn-primary btn-full" id="submitBtn" data-i18n="login.submit">Login</button>
        <div id="error" class="error-msg"></div>
      </form>
    </div>
  </div>
  <script>
    // Inject API base
    window.API_BASE = 'https://selfbot-api.kobsser-m.workers.dev';
  </script>
  <script src="/js/theme.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
  <script>
    initLoginPage();
  </script>
</body>
</html>
