name = "selfbot"
main = "src/index.js"
compatibility_date = "2024-09-23"

# Static UI served by this same Worker
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "none"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "selfbot-db"
database_id = "fef77174-510c-411b-874b-6f6986e676a5"

# Cron: check every 5 min whether a new game job should start
[triggers]
crons = ["*/5 * * * *"]
