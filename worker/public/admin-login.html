<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Admin</title>
<link rel="stylesheet" href="/css/styles.css"></head>
<body>
<div class="auth-container"><div class="auth-card">
  <div class="theme-toggle-row"><button id="themeToggle" class="icon-btn">🌓</button></div>
  <h2>Admin Access</h2>
  <form id="adminForm">
    <div class="form-group"><label>Password</label><input type="password" id="adminPassword" required></div>
    <button type="submit" class="btn btn-primary btn-full">Enter</button>
    <div id="error" class="error-msg"></div>
  </form>
</div></div>
<script src="/js/theme.js"></script><script src="/js/api.js"></script>
<script>
const p = new URLSearchParams(location.search);
if (p.get('admin')) sessionStorage.setItem('admin_param', p.get('admin'));
document.getElementById('adminForm').addEventListener('submit', async e => {
  e.preventDefault();
  const res = await api.post('/api/auth/admin', {
    param: sessionStorage.getItem('admin_param') || '',
    password: document.getElementById('adminPassword').value
  });
  if (res.ok) location.href = '/admin';
  else document.getElementById('error').textContent = 'Invalid credentials';
});
</script></body></html>
